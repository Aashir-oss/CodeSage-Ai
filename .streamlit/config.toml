[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#0a0a0f"
secondaryBackgroundColor = "#16161d"
textColor = "#e2e8f0"
baseRadius = "0.75rem"

[server]
maxUploadSize = 500
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
showSidebarNavigation = false

